<svg xmlns="http://www.w3.org/2000/svg" width="370" height="202" viewBox="0 0 370 202" role="img" aria-label="Most used languages"><style>
  .card{fill:#0d1117;stroke:#1e293b;stroke-width:1.5}
  .title{font:600 16px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#e2e8f0}
  .label{font:400 12px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#94a3b8}
  .num{font:700 22px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#e2e8f0}
  .lang{font:500 12px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#cbd5e1}
  .pct{font:400 12px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#64748b}
  .accent{fill:#38bdf8}
  .tile{fill:#111827;stroke:#1e293b;stroke-width:1}
  .track{fill:#1e293b}
  .in{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
  .bar{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}
  .pulse{animation:pulse 2.8s ease-in-out infinite}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style><rect class="card" x="0.75" y="0.75" width="368.5" height="200.5" rx="12"/><circle class="accent pulse" cx="26" cy="29" r="4"/><text class="title" x="40" y="34">Top Languages</text><g class="in" style="animation-delay:0.10s"><circle cx="26" cy="62" r="4" fill="#f1e05a"/><text class="lang" x="40" y="66">JavaScript</text><rect class="track" x="150" y="58" width="150" height="8" rx="4"/><rect class="bar" x="150" y="58" width="150.0" height="8" rx="4" fill="#f1e05a" style="animation-delay:0.25s"/><text class="pct" x="350" y="66" text-anchor="end">34.8%</text></g><g class="in" style="animation-delay:0.22s"><circle cx="26" cy="84" r="4" fill="#8892bf"/><text class="lang" x="40" y="88">PHP</text><rect class="track" x="150" y="80" width="150" height="8" rx="4"/><rect class="bar" x="150" y="80" width="71.7" height="8" rx="4" fill="#8892bf" style="animation-delay:0.37s"/><text class="pct" x="350" y="88" text-anchor="end">16.6%</text></g><g class="in" style="animation-delay:0.34s"><circle cx="26" cy="106" r="4" fill="#e34c26"/><text class="lang" x="40" y="110">HTML</text><rect class="track" x="150" y="102" width="150" height="8" rx="4"/><rect class="bar" x="150" y="102" width="59.5" height="8" rx="4" fill="#e34c26" style="animation-delay:0.49s"/><text class="pct" x="350" y="110" text-anchor="end">13.8%</text></g><g class="in" style="animation-delay:0.46s"><circle cx="26" cy="128" r="4" fill="#8a63d2"/><text class="lang" x="40" y="132">CSS</text><rect class="track" x="150" y="124" width="150" height="8" rx="4"/><rect class="bar" x="150" y="124" width="51.1" height="8" rx="4" fill="#8a63d2" style="animation-delay:0.61s"/><text class="pct" x="350" y="132" text-anchor="end">11.9%</text></g><g class="in" style="animation-delay:0.58s"><circle cx="26" cy="150" r="4" fill="#7dd3fc"/><text class="lang" x="40" y="154">C#</text><rect class="track" x="150" y="146" width="150" height="8" rx="4"/><rect class="bar" x="150" y="146" width="33.9" height="8" rx="4" fill="#7dd3fc" style="