<svg xmlns="http://www.w3.org/2000/svg" width="460" height="200" viewBox="0 0 460 200" role="img" aria-label="GitHub overview statistics"><style>
  .card{fill:#0d1117;stroke:#1e293b;stroke-width:1.5}
  .title{font:600 16px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#e2e8f0}
  .label{font:400 12px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#94a3b8}
  .num{font:700 22px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#e2e8f0}
  .lang{font:500 12px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#cbd5e1}
  .pct{font:400 12px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#64748b}
  .accent{fill:#38bdf8}
  .tile{fill:#111827;stroke:#1e293b;stroke-width:1}
  .track{fill:#1e293b}
  .in{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
  .bar{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}
  .pulse{animation:pulse 2.8s ease-in-out infinite}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style><rect class="card" x="0.75" y="0.75" width="458.5" height="198.5" rx="12"/><circle class="accent pulse" cx="26" cy="29" r="4"/><text class="title" x="40" y="34">GitHub Overview</text><text class="label" x="436" y="34" text-anchor="end">@AneeqUllahKhan</text><g class="in" style="animation-delay:0.1s"><rect class="tile" x="20" y="56" width="134" height="58" rx="9"/><rect class="accent" x="20" y="70" width="3" height="30" rx="1.5"/><text class="num" x="36" y="85">5</text><text class="label" x="36" y="102">Stars earned</text></g><g class="in" style="animation-delay:0.2s"><rect class="tile" x="163" y="56" width="134" height="58" rx="9"/><rect class="accent" x="163" y="70" width="3" height="30" rx="1.5"/><text class="num" x="179" y="85">153</text><text class="label" x="179" y="102">Commits (public)</text></g><g class="in" style="animation-delay:0.3s"><rect class="tile" x="306" y="56" width="134" height="58" rx="9"/><rect class="accent" x="306" y="70" width="3" height="30" rx="1.5"/><text class="num" x="322" y="85">2</text><text class="label" x="322" y="102">Pull requests</text></g><g class="in" style="animation-delay:0.4s"><rect class="tile" x="20" y="124" width="134" height="58" rx="9"/><rect class="accent" x="20" y="138" width="3" height="30" rx="1.5"/><text class="num" x="36" y="153">0</text><text class="label" x="36" y="170">Issues opened</text></g><g class="in" style="animation-delay:0.5s"><rect class="tile" x="163" y="124" width="134" height="58" rx="9"/><rect class="accent" x="163" y="138" width="3" height="30" rx="1.5"/><text class="num" x="179" y="153">44</text><text class="label" x="179" y="170">Public repos</text></g><g class="in" style="animation-delay:0.6s"><rect class="tile" x="306" y="124" width="134" height="58" rx="9"/><rect class="accent" x="306" y="138" width="3" height="30" rx="1.5"/><text class="num" x="322" y="153">18</text><text class="label" x="322" y="170">Followers</text></g></svg>